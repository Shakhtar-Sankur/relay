name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake -S . -B build -G Ninja -DRELAY_NATIVE=OFF
      - run: cmake --build build
      - name: tests (logits against Hugging Face on 4 tiny models; batching, chunking, preemption bit for bit; prefill/decode split over TCP and shared memory bit for bit)
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake -S . -B build -G Ninja -DRELAY_NATIVE=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
      - run: cmake --build build --target test_transfer test_batching test_worker test_faults
      - name: the threaded code (sender, receiver, engine) under ThreadSanitizer
        run: |
          OMP_NUM_THREADS=1 TSAN_OPTIONS=halt_on_error=1 ./build/test_transfer
          OMP_NUM_THREADS=1 TSAN_OPTIONS=halt_on_error=1 ./build/test_batching
          OMP_NUM_THREADS=1 TSAN_OPTIONS=halt_on_error=1 RELAY_STRESS_ROUNDS=5 ./build/test_worker
          OMP_NUM_THREADS=1 TSAN_OPTIONS=halt_on_error=1 RELAY_FAULT_SEEDS=60 ./build/test_faults

  swift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Swift 6.4 toolchain
        run: |
          sudo mkdir -p /opt/swift
          curl -sSfL https://download.swift.org/swift-6.4.0-release/ubuntu2404/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu24.04.tar.gz | sudo tar xz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      - run: swift build --build-tests
      - name: tokenizer vs Hugging Face, chat templates vs transformers, the OpenAI server end to end (Swift calling the C++ engine)
        run: swift test --skip-build

  cuda-compiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build nvidia-cuda-toolkit
      - run: cmake -S . -B build -G Ninja -DRELAY_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler
      - run: cmake --build build
